# On every pull request that touches an entry: the entry's claims block must
# be what the code says. `scripts/check.mjs` asks npm for the version, reads
# its provenance, and runs `buddi plugins describe`, which stages the package
# the way an install would and reads its manifest; the committed block has to
# match. buddi itself comes from npm (`@withbuddi/buddi`, its `latest`), into a
# scratch data directory: nothing is installed, migrated or registered.
#
# Catalogue agents (agents/**) are checked on every run: schema, files and
# limits, the grant against the tools buddi and the listed plugins have, the
# v1 denylist, the persona lint, integrity and claims, and that a changed
# package moved its version against the base branch. No npm needed.
name: check
on:
  pull_request:
    paths: ['plugins/**', 'agents/**', 'schemas/**', 'scripts/**']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Which entries changed
        id: changed
        run: |
          plugins="all"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            names=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- plugins | sed -n 's#^plugins/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
            if [ -z "$names" ]; then plugins="none"; else plugins="some"; fi
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- scripts | grep -q .; then names=""; plugins="all"; fi
          else
            names=""
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "plugins: $plugins ${names}"
      - name: buddi from npm, in a scratch installation
        run: |
          npm install -g @withbuddi/buddi
          scratch="$RUNNER_TEMP/buddi"
          mkdir -p "$scratch/data" && : > "$scratch/empty.env"
          {
            echo "BUDDI_DATA_DIR=$scratch/data"
            echo "BUDDI_PLUGINS_FILE=$scratch/plugins.json"
            echo "BUDDI_ENV_FILE=$scratch/empty.env"
            echo "BUDDI_VAULT=memory"
          } >> "$GITHUB_ENV"
          buddi --version
      - name: The claims are what the code says (plugins)
        if: steps.changed.outputs.plugins != 'none'
        run: node scripts/check.mjs ${{ steps.changed.outputs.names }}
      - name: The agents are what their packages say
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: node scripts/check.mjs --agents
      - name: The check's own tests
        run: node --test scripts/agents.test.mjs scripts/lib.test.mjs
      - name: The index builds
        run: node scripts/index.mjs "$RUNNER_TEMP/index.json" && node -e 'const i=require(process.argv[1]);console.log(i.plugins.map(p=>p.name+"@"+p.version).concat(i.agents.map(a=>"agent:"+a.name+"@"+a.version)).join(", "))' "$RUNNER_TEMP/index.json"
