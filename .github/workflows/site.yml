# A merge is a listing: withbuddi.com rebuilds from this repository through
# the site's Cloudflare deploy hook, kept as the secret SITE_DEPLOY_HOOK (the
# same hook buddi's docs use). Without it, nothing happens here and the site
# picks the change up on its next deploy.
name: site
on:
  push:
    branches: [main]
    paths: ['plugins/**', 'agents/**', 'scripts/index.mjs', 'scripts/lib.mjs', 'scripts/agents.mjs']
  workflow_dispatch:
permissions: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
    steps:
      - name: Ask Cloudflare to rebuild the site
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" -o /dev/null && echo "site rebuild requested"
      - name: No hook configured
        if: env.HOOK == ''
        run: echo "SITE_DEPLOY_HOOK is not set; the site rebuilds on its own pushes only."
